<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1c2134">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Ineffable — Dil Grameri</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-shell">

  <header class="app-header">
    <div class="brand">
      <img src="icons/icon-192.png" alt="" class="brand-mark" width="32" height="32">
      <div>
        Ineffable
        <small>söze sığmayan gramer</small>
      </div>
    </div>
    <div class="header-actions">
      <button id="themeToggle" class="icon-btn" aria-label="Tema değiştir" title="Karanlık/Aydınlık mod">🌙</button>
      <button id="statsBtn" class="icon-btn" aria-label="İstatistikler" title="İstatistikler">📊</button>
      <button id="exportBtn" class="icon-btn" aria-label="Dışa aktar" title="Verileri dışa aktar">📤</button>
    </div>
  </header>

  <div id="streakBadge" class="streak-badge"></div>

  <section class="hero">
    <div class="hero-seam">
      <div class="hero-half en">
        <span class="cap">English</span>
        <span class="word">the ineffable</span>
      </div>
      <div class="hero-half ru">
        <span class="cap">Русский</span>
        <span class="word">невыразимое</span>
      </div>
    </div>
    <p class="hero-note" id="heroNote"></p>
  </section>

  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="🔍 Ders ara..." aria-label="Ders ara">
    <button id="clearSearch" class="search-clear" aria-label="Aramayı temizle">✕</button>
  </div>

  <div class="tabs" id="tabs"></div>

  <div class="view-switch" id="viewSwitch">
    <button class="view-btn active" data-view="lessons" aria-pressed="true">📚 Dersler</button>
    <button class="view-btn" data-view="practice" aria-pressed="false">✏️ Alıştırma</button>
    <button class="view-btn" data-view="favorites" aria-pressed="false">⭐ Favoriler</button>
  </div>

  <div class="chips" id="chips"></div>

  <div class="practice-dashboard" id="practiceDashboard"></div>

  <div class="lesson-list" id="lessonList"></div>

  <div class="install-bar" id="installBar">
    <span>Ineffable'ı ana ekranına ekle, çevrimdışı da çalışsın.</span>
    <button id="installBtn">Ekle</button>
  </div>

  <p class="footer-note">Ineffable · İngilizce ve Rusça gramer defteri</p>
</div>

<!-- Overlay -->
<div class="overlay" id="overlay">
  <div class="notebook" id="notebook" role="dialog" aria-modal="true"></div>
</div>

<!-- Stats Modal -->
<div class="overlay" id="statsOverlay">
  <div class="notebook stats-notebook" id="statsNotebook" role="dialog" aria-modal="true">
    <div class="notebook-inner">
      <button class="nb-close" id="statsClose" aria-label="Kapat">✕</button>
      <h2 class="nb-term-box small">📊 İstatistikler</h2>
      <div id="statsContent"></div>
    </div>
  </div>
</div>

<!-- Daily Challenge Modal -->
<div class="overlay" id="challengeOverlay">
  <div class="notebook challenge-notebook" id="challengeNotebook" role="dialog" aria-modal="true">
    <div class="notebook-inner">
      <button class="nb-close" id="challengeClose" aria-label="Kapat">✕</button>
      <div id="challengeContent"></div>
    </div>
  </div>
</div>

<script src="grammar.js"></script>
<script src="app.js"></script>
</body>
</html>
